version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jailbreak-detector:latest
    command: ["api"]
    environment:
      - PORT=8001
      - THRESHOLD=0.4909
      - MODEL_PATH=jailbreak_detector_light.joblib
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jailbreak-detector:latest
    command: ["streamlit"]
    environment:
      - API_URL=http://api:8001
      - STREAMLIT_PORT=8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
